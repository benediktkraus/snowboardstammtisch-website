name = "stammtisch-platform"
main = "src/index.js"
compatibility_date = "2026-08-25"
workers_dev = true

[vars]
DEFAULT_SITE_ID = "innsbruck"
ASSET_ORIGIN = "https://snowboardstammtisch-website.pages.dev"
PLATFORM_ROOT_DOMAIN = "stammtisch.example"

[[d1_databases]]
binding = "DB"
database_name = "stammtisch-platform"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"
