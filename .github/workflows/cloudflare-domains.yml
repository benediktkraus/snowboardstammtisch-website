name: Configure Cloudflare domains

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Configure canonical domain redirects
        shell: bash
        run: |
          set -euo pipefail

          api=https://api.cloudflare.com/client/v4
          zone_name=snowboardstammtisch.at
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          cf() { curl --silent --show-error --fail-with-body "${headers[@]}" "$@"; }
          check() {
            jq -e '.success == true' >/dev/null <<<"$1" || {
              jq '{errors, messages}' <<<"$1"
              exit 1
            }
          }

          zones=$(cf --get "$api/zones" --data-urlencode "name=$zone_name" --data-urlencode 'status=active')
          check "$zones"
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zones")
          [[ -n "$zone_id" ]]

          dns=$(cf --get "$api/zones/$zone_id/dns_records" --data-urlencode 'per_page=100')
          rulesets=$(cf "$api/zones/$zone_id/rulesets")
          check "$dns"
          check "$rulesets"

          rule=$(jq -cn '{
            ref: "canonical_subdomains_to_apex",
            description: "Redirect all subdomains to the canonical HTTPS apex",
            expression: "ends_with(http.host, \".snowboardstammtisch.at\")",
            action: "redirect",
            action_parameters: {from_value: {
              target_url: {expression: "concat(\"https://snowboardstammtisch.at\", http.request.uri.path)"},
              status_code: 301,
              preserve_query_string: true
            }},
            enabled: true
          }')

          ruleset_id=$(jq -r 'first(.result[] | select(.phase == "http_request_dynamic_redirect") | .id) // empty' <<<"$rulesets")
          if [[ -z "$ruleset_id" ]]; then
            payload=$(jq -cn --argjson rule "$rule" '{
              name: "Canonical redirects",
              kind: "zone",
              phase: "http_request_dynamic_redirect",
              rules: [$rule]
            }')
            result=$(cf -X POST --data "$payload" "$api/zones/$zone_id/rulesets")
          else
            ruleset=$(cf "$api/zones/$zone_id/rulesets/$ruleset_id")
            check "$ruleset"
            rule_id=$(jq -r 'first(.result.rules[]? | select(.ref == "canonical_subdomains_to_apex") | .id) // empty' <<<"$ruleset")
            if [[ -z "$rule_id" ]]; then
              result=$(cf -X POST --data "$rule" "$api/zones/$zone_id/rulesets/$ruleset_id/rules")
            else
              result=$(cf -X PATCH --data "$rule" "$api/zones/$zone_id/rulesets/$ruleset_id/rules/$rule_id")
            fi
          fi
          check "$result"

          wildcard="*.$zone_name"
          dns_payload=$(jq -cn --arg name "$wildcard" '{
            type: "A",
            name: $name,
            content: "192.0.2.1",
            ttl: 1,
            proxied: true
          }')
          dns_id=$(jq -r --arg name "$wildcard" 'first(.result[] | select(.name == $name) | .id) // empty' <<<"$dns")
          if [[ -z "$dns_id" ]]; then
            result=$(cf -X POST --data "$dns_payload" "$api/zones/$zone_id/dns_records")
          else
            result=$(cf -X PUT --data "$dns_payload" "$api/zones/$zone_id/dns_records/$dns_id")
          fi
          check "$result"
