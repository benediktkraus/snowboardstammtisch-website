name: Deploy isolated Shred Radar preview

on:
  push:
    branches:
      - preview-shred-radar-rocknroll-20260821

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy preview-site --project-name shred-radar-rocknroll-preview-20260821 --branch preview-shred-radar-rocknroll-20260821
